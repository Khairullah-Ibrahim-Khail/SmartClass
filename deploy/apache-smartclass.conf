# SmartClass on Apache + PHP-FPM.  Save as /etc/apache2/sites-available/smartclass.conf, then:
#   sudo a2enmod proxy_fcgi setenvif rewrite headers && sudo a2enconf php8.3-fpm
#   sudo a2ensite smartclass && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d school.example.com        (adds the https site and the redirect)
# Change: ServerName, DocumentRoot/Directory, and the php version in the socket path.
<VirtualHost *:80>
    ServerName school.example.com
    DocumentRoot /var/www/smartclass
    <Directory /var/www/smartclass>
        AllowOverride All          # the .htaccess files deny config/, includes/, .git ... and the private upload folders
        Require all granted
        Options -Indexes
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        # live AI answers can take minutes
    </FilesMatch>
    ProxyTimeout 300
    ErrorLog ${APACHE_LOG_DIR}/smartclass-error.log
    CustomLog ${APACHE_LOG_DIR}/smartclass-access.log combined
</VirtualHost>
