; PHP settings for SmartClass with PHP-FPM.  Save as /etc/php/8.3/fpm/conf.d/90-smartclass.ini  then:  sudo systemctl restart php8.3-fpm
; (With Apache mod_php the same two upload values come from the project's .htaccess.)
upload_max_filesize = 14M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120
expose_php = Off
session.gc_maxlifetime = 86400
date.timezone = Asia/Kabul
