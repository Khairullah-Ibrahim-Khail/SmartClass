# SmartClass on nginx + PHP-FPM.  Save as /etc/nginx/sites-available/smartclass, link into sites-enabled, then:  sudo nginx -t && sudo systemctl reload nginx
# Then get the certificate (it adds the https server block by itself):  sudo certbot --nginx -d school.example.com
# Change: server_name, root, and the PHP-FPM socket (ls /run/php/). This block was syntax-checked with nginx -t and its deny rules were tested with curl.
server {
  listen 80;
  server_name school.example.com;
  root /var/www/smartclass;
  index index.php;
  client_max_body_size 20m;                      # uploads up to 14 MB + form fields

  # never serve hidden files, the repository, code, tests, logs, backups, sessions
  location ~ /\.(?!well-known) { return 404; }
  location ~ ^/(config|includes|bin|cron|tests|qa|docs|logs|backups|sessions|instances)(/|$) { return 403; }
  location ~ ^/(README|TODO)\.md$ { return 403; }

  # uploaded files: private folders are only served through PHP; nothing in uploads/ may ever execute
  location ^~ /uploads/avatars/     { return 403; }
  location ^~ /uploads/branding/    { return 403; }
  location ^~ /uploads/lectures/    { return 403; }
  location ^~ /uploads/forum/       { return 403; }
  location ^~ /uploads/resources/   { return 403; }
  location ^~ /uploads/submissions/ { return 403; }
  location ^~ /uploads/ { autoindex off; location ~* \.(php|phtml|phar|php[0-9]|pl|py|cgi|sh)$ { return 403; } }

  location / { try_files $uri $uri/ =404; }

  location ~ \.php$ {
      try_files $uri =404;
      fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # your PHP-FPM socket
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      include /etc/nginx/fastcgi_params;
      fastcgi_param HTTPS $https if_not_empty;
      fastcgi_read_timeout 300;                     # live AI answers can last minutes
  }
  # live (streamed) AI answers: send words as they arrive
  location ~ ^/pages/ai/.*\.php$ {
      fastcgi_pass unix:/run/php/php8.3-fpm.sock;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      include /etc/nginx/fastcgi_params;
      fastcgi_param HTTPS $https if_not_empty;
      fastcgi_buffering off; fastcgi_read_timeout 300;
  }
}

