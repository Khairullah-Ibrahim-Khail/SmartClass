<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      /* Navbar */
      nav {
        background-color: #333;
        padding: 1rem 2rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      nav ul {
        list-style: none;
        display: flex;
        gap: 2rem;
      }

      nav a {
        color: white;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.3s;
        padding: 0.5rem 1rem;
        border-radius: 4px;
      }

      nav a:hover {
        color: #4caf50;
      }

      nav a.active {
        background-color: #4caf50;
        color: white;
      }

      /* Main Container */
      .container {
        display: flex;
        min-height: calc(100vh - 60px);
      }

      /* Sidebar (Optional) */
      aside {
        width: 250px;
        background-color: #222;
        padding: 1rem;
        color: white;
      }

      aside a {
        display: block;
        padding: 0.5rem;
        color: white;
        text-decoration: none;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.3s;
        margin-bottom: 0.5rem;
      }

      aside a:hover {
        background-color: #4caf50;
      }

      aside a.active {
        background-color: #4caf50;
      }

      /* Main Content Area */
      main {
        flex: 1;
        padding: 2rem;
        background-color: white;
        margin: 1rem;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .loading {
        color: #666;
        font-style: italic;
      }

      .error {
        color: #f44336;
        padding: 1rem;
        background-color: #ffebee;
        border-radius: 4px;
        border-left: 4px solid #f44336;
      }

      /* Footer */
      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 1rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav>
      <ul>
        <li><a onclick="loadPage('home', this)">Home</a></li>
        <li><a onclick="loadPage('about', this)">About</a></li>
        <li><a onclick="loadPage('services', this)">Services</a></li>
        <li><a onclick="loadPage('contact', this)">Contact</a></li>
      </ul>
    </nav>

    <!-- Main Container -->
    <div class="container">
      <!-- Sidebar -->
      <aside>
        <h3>Menu</h3>
        <a onclick="loadPage('home', this)">Dashboard</a>
        <a onclick="loadPage('profile', this)">Profile</a>
        <a onclick="loadPage('settings', this)">Settings</a>
      </aside>

      <!-- Main Content Area -->
      <main id="mainContent">
        <h1>Welcome to My Project</h1>
        <p>Select a page from the navigation menu to get started.</p>
      </main>
    </div>

    <!-- Footer -->
    <footer>
      <p>&copy; 2024 My Project. All rights reserved.</p>
    </footer>

    <script>
      // Current active page
      let currentPage = "home";
      let activeNavElement = null;
      let activeSidebarElement = null;

      function loadPage(pageName, element) {
        const mainContent = document.getElementById("mainContent");

        // Show loading
        mainContent.innerHTML = `<p class="loading">Loading ${pageName}...</p>`;

        // Update active states
        updateActiveState(element);

        // Save current page
        currentPage = pageName;

        // Try to load the page
        fetch(`${pageName}.html`)
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Page "${pageName}" not found (404)`);
            }
            return response.text();
          })
          .then((data) => {
            mainContent.innerHTML = data;
          })
          .catch((error) => {
            mainContent.innerHTML = `
              <div class="error">
                <h2>Error Loading Page</h2>
                <p>${error.message}</p>
                <p>Create <strong>Html/${pageName}.html</strong> file to fix this.</p>
                <p><button onclick="loadPage('home', document.querySelector('nav a'))">Return to Home</button></p>
              </div>
            `;
          });
      }

      function updateActiveState(element) {
        // Clear previous active states
        if (activeNavElement) activeNavElement.classList.remove("active");
        if (activeSidebarElement)
          activeSidebarElement.classList.remove("active");

        // Set new active state
        element.classList.add("active");

        // Save reference
        if (element.parentNode.parentNode.tagName === "NAV") {
          activeNavElement = element;
        } else {
          activeSidebarElement = element;
        }
      }

      // Set home as active on load
      window.addEventListener("DOMContentLoaded", () => {
        const homeLink = document.querySelector("nav a");
        homeLink.classList.add("active");
        activeNavElement = homeLink;
      });
    </script>
  </body>
</html>
